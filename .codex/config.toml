personality = "friendly"

[mcp_servers.ag-mcp]
command = "npx"
args = [ "ag-mcp" ]

[mcp_servers.primeng]
command = "npx"
args = [ "-y", "@primeng/mcp" ]

[mcp_servers.angular-cli]
command = "npx"
args = [ "-y", "@angular/cli", "mcp" ]

[mcp_servers.tailwindcss]
command = "npx"
args = [ "-y", "tailwindcss-mcp-server" ]

[mcp_servers.macro-mcp]
command = "node"
args = [ "E:/MacroDesktopMFE/macro/dist/apps/macro-mcp/main.js" ]

[mcp_servers.nx-mcp]
command = "npx"
args = [ "nx", "mcp" ]

[features]
multi_agent = true

[agents.ci-monitor-subagent]
description = "CI helper for /monitor-ci. Fetches CI status, retrieves fix details, or updates self-healing fixes. Executes one MCP tool call and returns the result."
config_file = "agents/ci-monitor-subagent.toml"
